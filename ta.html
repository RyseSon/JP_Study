<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日语「た行」强化测验</title>
    <style>
        :root {
            --primary: #E67E22; /* た行采用珊瑚橙色 */
            --primary-hover: #D35400;
            --bg-color: #FDFEFE;
            --card-bg: #FFFFFF;
            --text-main: #2C3E50;
            --text-muted: #7F8C8D;
            --correct: #27AE60;
            --wrong: #E74C3C;
            --tip-bg: #FEF5EE;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            width: 95%;
            max-width: 500px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(230, 126, 34, 0.1);
            padding: 40px;
            text-align: center;
            border: 1px solid #FAD7A0;
        }

        .screen { display: none; }
        .screen.active { display: block; }

        h1 { font-size: 28px; margin-bottom: 15px; color: var(--primary); }
        p { margin-bottom: 25px; color: var(--text-muted); line-height: 1.6; font-size: 15px; }

        .progress { font-size: 14px; color: var(--text-muted); margin-bottom: 10px; letter-spacing: 1px; }

        .question-box {
            font-size: 95px;
            font-weight: bold;
            margin: 20px 0;
            color: var(--text-main);
            min-height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #FBFCFC;
            border-radius: 18px;
            border: 2px dashed #FAD7A0;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
            border-radius: 12px;
            font-size: 20px;
            font-weight: 600;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            padding: 16px 28px;
            width: 100%;
        }

        .btn-primary:hover { transform: scale(1.02); background-color: var(--primary-hover); }

        .btn-option {
            background-color: #F4F6F7;
            padding: 22px 10px;
            border: 2px solid transparent;
            color: var(--text-main);
        }

        .btn-option:hover:not(:disabled) { background-color: #EBEDEF; border-color: #FAD7A0; }
        .btn-option:disabled { cursor: not-allowed; opacity: 0.8; }
        .btn-option.correct { background-color: var(--correct); color: white; }
        .btn-option.wrong { background-color: var(--wrong); color: white; animation: shake 0.4s; }

        /* 结果与评价样式 */
        .stats-summary {
            background: #FDF2E9;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .stat-item { display: flex; justify-content: space-between; align-items: center; }
        .stat-val { font-weight: 800; font-size: 18px; color: var(--primary); }

        .rank-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 6px;
            background: var(--primary);
            color: white;
            font-size: 14px;
            font-weight: bold;
        }

        .error-log {
            text-align: left;
            margin-bottom: 25px;
            background: #FFF5F5;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #FADBD8;
        }

        .error-title { font-size: 14px; font-weight: 700; color: var(--wrong); margin-bottom: 10px; }
        .tag-list { display: flex; flex-wrap: wrap; gap: 8px; }
        .tag { background: white; color: var(--wrong); border: 1.5px solid var(--wrong); padding: 4px 10px; border-radius: 8px; font-size: 13px; font-weight: bold; }

        .brain-tip {
            background-color: var(--tip-bg);
            border-left: 5px solid var(--primary);
            padding: 15px;
            margin-bottom: 25px;
            border-radius: 4px;
            font-size: 13px;
            color: #A04000;
            text-align: left;
            line-height: 1.6;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 开始屏幕 -->
    <div id="start-screen" class="screen active">
        <h1>日语「た行」测验</h1>
        <p>包含「た、ち、つ、て、と」的双向识别测验。<br>系统将根据反应时长评估您的“自动性”等级。</p>
        <button class="btn-primary" onclick="startQuiz()">开始测验</button>
    </div>

    <!-- 测验屏幕 -->
    <div id="quiz-screen" class="screen">
        <div class="progress" id="progress-text">进度: 0 / 20</div>
        <div class="question-box" id="question-text">た</div>
        <div class="options-grid" id="options-container"></div>
    </div>

    <!-- 结果屏幕 -->
    <div id="result-screen" class="screen">
        <h1>测验总结报告</h1>
        
        <div class="stats-summary">
            <div class="stat-item">
                <span>平均反应时长：</span>
                <span id="avg-time" class="stat-val">0.00s</span>
            </div>
            <div class="stat-item">
                <span>掌握等级评估：</span>
                <span id="rank-name" class="rank-badge">-</span>
            </div>
            <div class="stat-item">
                <span>总计错误次数：</span>
                <span id="total-err" class="stat-val" style="color:var(--wrong)">0</span>
            </div>
        </div>

        <div id="error-section" class="error-log" style="display:none;">
            <div class="error-title">🔍 需要巩固的项目：</div>
            <div id="error-tags" class="tag-list"></div>
        </div>

        <div class="brain-tip" id="brain-tip-content"></div>

        <button class="btn-primary" onclick="resetQuiz()">重新挑战</button>
    </div>
</div>

<script>
    const taGyou = [
        { romaji: 'ta', hira: 'た', kata: 'タ' },
        { romaji: 'chi', hira: 'ち', kata: 'チ' },
        { romaji: 'tsu', hira: 'つ', kata: 'ツ' },
        { romaji: 'te', hira: 'て', kata: 'テ' },
        { romaji: 'to', hira: 'と', kata: 'ト' }
    ];

    const rankRules = [
        { max: 0.8, name: "条件反射级 ⚡", tip: "惊人的表现！你已经建立了极强的神经通路，这些假名对你而言如同本能。" },
        { max: 1.2, name: "流畅熟练级 ✨", tip: "非常出色！你的识别速度足以应对流畅的日语阅读，继续保持。" },
        { max: 2.0, name: "标准合格级 ✅", tip: "掌握良好，但大脑仍有微小的检索延迟，多加练习即可进入直觉阶段。" },
        { max: 3.5, name: "正在学习级 📘", tip: "你正在建立逻辑连接。尝试增加练习频率，减少“思考”的时间。" },
        { max: Infinity, name: "需要强化级 🔄", tip: "建议先回到静态记忆阶段。不要急于速度，准确率是提速的基础。" }
    ];

    let quizData = [], currentIdx = 0, errorMap = {};
    let qStartTime = 0, sumTime = 0, hasInteracted = false;

    function initQuiz() {
        let pool = [];
        taGyou.forEach(item => {
            pool.push({ q: item.hira, a: item.romaji, type: 'romaji', label: item.hira });
            pool.push({ q: item.kata, a: item.romaji, type: 'romaji', label: item.kata });
            pool.push({ q: item.romaji, a: item.hira, type: 'hira', label: item.romaji });
            pool.push({ q: item.romaji, a: item.kata, type: 'kata', label: item.romaji });
        });
        return pool.sort(() => Math.random() - 0.5);
    }

    function startQuiz() {
        quizData = initQuiz();
        currentIdx = 0;
        errorMap = {};
        sumTime = 0;
        showScreen('start-screen', 'quiz-screen');
        showScreen('result-screen', 'quiz-screen');
        loadQuestion();
    }

    function loadQuestion() {
        if (currentIdx >= quizData.length) return showResults();
        
        const q = quizData[currentIdx];
        document.getElementById('progress-text').innerText = `STEP: ${currentIdx + 1} / ${quizData.length}`;
        document.getElementById('question-text').innerText = q.q;
        
        const optionsBox = document.getElementById('options-container');
        optionsBox.innerHTML = '';
        hasInteracted = false;

        let options = [];
        if (q.type === 'romaji') options = taGyou.map(d => d.romaji);
        else if (q.type === 'hira') options = taGyou.map(d => d.hira);
        else options = taGyou.map(d => d.kata);

        options.sort(() => Math.random() - 0.5).forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'btn-option';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(opt, q.a, btn, q.label);
            optionsBox.appendChild(btn);
        });
        qStartTime = performance.now();
    }

    function checkAnswer(val, correct, btn, label) {
        if (!hasInteracted) {
            sumTime += (performance.now() - qStartTime);
            hasInteracted = true;
        }

        if (val === correct) {
            btn.classList.add('correct');
            document.querySelectorAll('.btn-option').forEach(b => b.disabled = true);
            setTimeout(() => { currentIdx++; loadQuestion(); }, 400);
        } else {
            if (!btn.classList.contains('wrong')) {
                btn.classList.add('wrong');
                errorMap[label] = (errorMap[label] || 0) + 1;
            }
        }
    }

    function showResults() {
        showScreen('quiz-screen', 'result-screen');
        
        const avg = (sumTime / quizData.length / 1000);
        document.getElementById('avg-time').innerText = avg.toFixed(2) + 's';
        
        // 计算等级
        const rank = rankRules.find(r => avg <= r.max);
        document.getElementById('rank-name').innerText = rank.name;
        document.getElementById('brain-tip-content').innerText = "💡 专家建议：" + rank.tip;

        const errKeys = Object.keys(errorMap);
        const totalErr = errKeys.length > 0 ? Object.values(errorMap).reduce((a, b) => a + b) : 0;
        document.getElementById('total-err').innerText = totalErr;

        const errSection = document.getElementById('error-section');
        const tagBox = document.getElementById('error-tags');
        
        if (totalErr > 0) {
            errSection.style.display = 'block';
            tagBox.innerHTML = errKeys.map(k => `<span class="tag">${k} (${errorMap[k]})</span>`).join('');
        } else {
            errSection.style.display = 'none';
        }
    }

    function showScreen(hide, show) {
        document.getElementById(hide).classList.remove('active');
        document.getElementById(show).classList.add('active');
    }

    function resetQuiz() { startQuiz(); }
</script>
</body>
</html>
