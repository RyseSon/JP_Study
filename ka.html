<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日语「か行」强化测验</title>
    <style>
        :root {
            --primary: #8E44AD;
            --primary-hover: #732D91;
            --bg-color: #F5F7FA;
            --card-bg: #FFFFFF;
            --text-main: #333333;
            --text-muted: #666666;
            --correct: #2ECC71;
            --wrong: #E74C3C;
            --tip-bg: #F0F3F4;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            width: 90%;
            max-width: 480px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            padding: 30px;
            text-align: center;
        }

        .screen { display: none; }
        .screen.active { display: block; }

        h1 { font-size: 24px; margin-bottom: 20px; color: var(--primary); }
        p { margin-bottom: 20px; color: var(--text-muted); line-height: 1.5; }

        .progress { font-size: 14px; color: var(--text-muted); margin-bottom: 15px; }

        .question-box {
            font-size: 80px;
            font-weight: bold;
            margin: 20px 0;
            color: var(--text-main);
            min-height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            padding: 12px 24px;
            width: 100%;
        }

        .btn-option {
            background-color: #EDF2F7;
            padding: 20px 10px;
            border: 2px solid transparent;
        }

        .btn-option:hover:not(:disabled) { background-color: #E2E8F0; }
        .btn-option:disabled { cursor: not-allowed; opacity: 0.7; }
        .btn-option.correct { background-color: var(--correct); color: white; }
        .btn-option.wrong { background-color: var(--wrong); color: white; animation: shake 0.4s; }

        /* 结果展示样式 */
        .stats-container {
            text-align: left;
            margin-bottom: 20px;
            background: #fdfdfd;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #eee;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
            font-size: 15px;
        }

        .error-list {
            padding: 15px;
            background: #fff5f5;
            max-height: 150px;
            overflow-y: auto;
            text-align: left;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .error-tag {
            display: inline-block;
            background: var(--wrong);
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            margin: 3px;
            font-size: 14px;
        }

        .science-tip {
            background-color: var(--tip-bg);
            border-left: 4px solid var(--primary);
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 4px;
            font-size: 13px;
            color: #555;
            text-align: left;
            line-height: 1.6;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
    </style>
</head>
<body>

<div class="container">
    <div id="start-screen" class="screen active">
        <h1>日语「か行」测试</h1>
        <p>包含平/片假名与罗马音互转。系统将记录具体错误项以便复习。</p>
        <button class="btn-primary" onclick="startQuiz()">开始测试</button>
    </div>

    <div id="quiz-screen" class="screen">
        <div class="progress" id="progress-text">进度: 0 / 20</div>
        <div class="question-box" id="question-text">か</div>
        <div class="options-grid" id="options-container"></div>
    </div>

    <div id="result-screen" class="screen">
        <h1>测试报告</h1>
        
        <div class="stats-container">
            <div class="result-item"><span>总错误次数：</span><span id="total-errors" class="result-value" style="font-weight:bold;color:var(--wrong)">0</span></div>
            <div class="result-item"><span>平均反应时间：</span><span id="avg-time" style="font-weight:bold;color:var(--primary)">0.00 秒</span></div>
        </div>

        <div id="error-detail-area" style="display:none;">
            <p style="text-align:left; font-size: 14px; margin-bottom: 5px; color: var(--text-main);">需要重点复习的项：</p>
            <div class="error-list" id="error-list-tags"></div>
        </div>

        <div class="science-tip" id="science-tip-box"></div>

        <button class="btn-primary" onclick="resetQuiz()">重新开始</button>
    </div>
</div>

<script>
    const dataGyou = [
        { romaji: 'ka', hiragana: 'か', katakana: 'カ' },
        { romaji: 'ki', hiragana: 'き', katakana: 'キ' },
        { romaji: 'ku', hiragana: 'く', katakana: 'ク' },
        { romaji: 'ke', hiragana: 'け', katakana: 'ケ' },
        { romaji: 'ko', hiragana: 'こ', katakana: 'コ' }
    ];

    const tips = [
        "💡 神经科学提示：错误是学习的黄金时刻。大脑在纠错时的神经活动比答对时更活跃，刚才的错误其实加深了你的记忆。",
        "💡 记忆技巧提示：将「き」想象成一把钥匙（Key）的形状，将「く」想象成布谷鸟的嘴巴（Ku-ku），利用图像联想可以大幅降低错误率。",
        "💡 运动学建议：现在快速站立并深呼吸三次。增加血氧含量能瞬间提升海马体处理刚才错题的效率。"
    ];

    let questions = [], currentIndex = 0, errorMap = {};
    let startTime = 0, totalTime = 0, firstClick = false;

    function generateQuiz() {
        let pool = [];
        dataGyou.forEach(item => {
            pool.push({ q: item.hiragana, a: item.romaji, type: 'romaji', label: item.hiragana });
            pool.push({ q: item.katakana, a: item.romaji, type: 'romaji', label: item.katakana });
            pool.push({ q: item.romaji, a: item.hiragana, type: 'hiragana', label: item.romaji });
            pool.push({ q: item.romaji, a: item.katakana, type: 'katakana', label: item.romaji });
        });
        return pool.sort(() => Math.random() - 0.5);
    }

    function startQuiz() {
        questions = generateQuiz();
        currentIndex = 0;
        errorMap = {};
        totalTime = 0;
        document.getElementById('start-screen').classList.remove('active');
        document.getElementById('quiz-screen').classList.add('active');
        document.getElementById('result-screen').classList.remove('active');
        loadNext();
    }

    function loadNext() {
        if (currentIndex >= questions.length) return showResult();
        
        const q = questions[currentIndex];
        document.getElementById('progress-text').innerText = `进度: ${currentIndex + 1} / ${questions.length}`;
        document.getElementById('question-text').innerText = q.q;
        
        const optionsArea = document.getElementById('options-container');
        optionsArea.innerHTML = '';
        firstClick = false;

        let opts = [];
        if (q.type === 'romaji') opts = dataGyou.map(i => i.romaji);
        else if (q.type === 'hiragana') opts = dataGyou.map(i => i.hiragana);
        else opts = dataGyou.map(i => i.katakana);

        opts.sort(() => Math.random() - 0.5).forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'btn-option';
            btn.innerText = opt;
            btn.onclick = () => check(opt, q.a, btn, q.label);
            optionsArea.appendChild(btn);
        });
        startTime = performance.now();
    }

    function check(selected, correct, btn, label) {
        if (!firstClick) {
            totalTime += (performance.now() - startTime);
            firstClick = true;
        }

        if (selected === correct) {
            btn.classList.add('correct');
            document.querySelectorAll('.btn-option').forEach(b => b.disabled = true);
            setTimeout(() => { currentIndex++; loadNext(); }, 500);
        } else {
            if (!btn.classList.contains('wrong')) {
                btn.classList.add('wrong');
                // 记录具体哪个题目的哪个项错了
                errorMap[label] = (errorMap[label] || 0) + 1;
            }
        }
    }

    function showResult() {
        document.getElementById('quiz-screen').classList.remove('active');
        document.getElementById('result-screen').classList.add('active');
        
        const totalErr = Object.values(errorMap).reduce((a, b) => a + b, 0);
        document.getElementById('total-errors').innerText = `${totalErr} 次`;
        document.getElementById('avg-time').innerText = `${(totalTime / questions.length / 1000).toFixed(2)} 秒`;

        const errorArea = document.getElementById('error-detail-area');
        const errorList = document.getElementById('error-list-tags');
        
        if (totalErr > 0) {
            errorArea.style.display = 'block';
            errorList.innerHTML = Object.keys(errorMap)
                .map(key => `<span class="error-tag">${key} (${errorMap[key]}次)</span>`)
                .join('');
        } else {
            errorArea.style.display = 'none';
        }

        document.getElementById('science-tip-box').innerText = tips[Math.floor(Math.random() * tips.length)];
    }

    function resetQuiz() {
        startQuiz();
    }
</script>
</body>
</html>
