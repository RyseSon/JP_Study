<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#e53935">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="日语か行练习">
    <meta name="description" content="日语か行的平假名和片假名练习应用">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="data:application/manifest+json,{
        %22name%22:%22日语か行练习%22,
        %22short_name%22:%22か行练习%22,
        %22description%22:%22日语か行的平假名和片假名练习应用%22,
        %22start_url%22:%22.%22,
        %22display%22:%22standalone%22,
        %22background_color%22:%22%23ffffff%22,
        %22theme_color%22:%22%23e53935%22,
        %22icons%22:[{
            %22src%22:%22data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Ccircle cx='96' cy='96' r='88' fill='%23e53935'/%3E%3Ctext x='96' y='115' font-family='Arial' font-size='80' fill='white' text-anchor='middle'%3E%EF%BD%B6%3C/text%3E%3C/svg%3E%22,
            %22sizes%22:%22192x192%22,
            %22type%22:%22image/svg+xml%22,
            %22purpose%22:%22any maskable%22
        },{
            %22src%22:%22data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Ccircle cx='256' cy='256' r='240' fill='%23e53935'/%3E%3Ctext x='256' y='310' font-family='Arial' font-size='200' fill='white' text-anchor='middle'%3E%EF%BD%B6%3C/text%3E%3C/svg%3E%22,
            %22sizes%22:%22512x512%22,
            %22type%22:%22image/svg+xml%22,
            %22purpose%22:%22any maskable%22
        }]
    }">
    
    <title>日语か行练习 - かきくけこ</title>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #e53935 0%, #d81b60 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            padding-top: 20px;
            color: #333;
            overscroll-behavior: none;
        }
        
        .container {
            background: white;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            padding: 30px 20px;
            text-align: center;
            max-width: 500px;
            width: 95%;
            margin: 0 auto;
            position: relative;
        }
        
        .header {
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        h1 {
            color: #333;
            font-size: 1.8em;
            margin-bottom: 8px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: bold;
            letter-spacing: 1px;
        }
        
        .subtitle {
            color: #666;
            font-size: 0.95em;
            margin-top: 5px;
        }
        
        .character-display {
            font-size: 6.5em;
            margin: 25px 0;
            height: 130px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
            font-weight: bold;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.15);
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        
        .options-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin: 25px 0;
            padding: 0 10px;
        }
        
        .option-btn {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border: 2px solid #e0e0e0;
            border-radius: 16px;
            padding: 18px 5px;
            font-size: 1.5em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #495057;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }
        
        .option-btn:active {
            transform: scale(0.95);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
        }
        
        .option-btn.correct {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            border: none;
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.4);
            animation: pulseGreen 0.5s ease;
        }
        
        .option-btn.incorrect {
            background: linear-gradient(135deg, #dc3545 0%, #e83e8c 100%);
            color: white;
            border: none;
            box-shadow: 0 4px 15px rgba(220, 53, 69, 0.4);
            animation: pulseRed 0.5s ease;
        }
        
        @keyframes pulseGreen {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        @keyframes pulseRed {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .control-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0 15px;
            flex-wrap: wrap;
        }
        
        .next-btn, .end-btn {
            background: linear-gradient(135deg, #007bff 0%, #4facfe 100%);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 14px 30px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(0, 123, 255, 0.4);
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        
        .end-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
        
        .next-btn:active, .end-btn:active {
            transform: translateY(2px);
            box-shadow: 0 3px 10px rgba(0, 123, 255, 0.5);
        }
        
        .next-btn:disabled, .end-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .result {
            margin: 20px 0;
            padding: 15px 20px;
            border-radius: 16px;
            font-size: 1.15em;
            font-weight: 600;
            min-height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            line-height: 1.4;
            text-align: center;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s ease;
        }
        
        .result.show {
            opacity: 1;
            transform: translateY(0);
        }
        
        .result.correct {
            background: rgba(40, 167, 69, 0.12);
            color: #28a745;
            border: 2px solid rgba(40, 167, 69, 0.25);
            animation: slideUp 0.4s ease;
        }
        
        .result.incorrect {
            background: rgba(220, 53, 69, 0.12);
            color: #dc3545;
            border: 2px solid rgba(220, 53, 69, 0.25);
            animation: slideUp 0.4s ease;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .stats {
            margin-top: 25px;
            padding: 18px;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-radius: 20px;
            text-align: left;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.08);
        }
        
        .stats h3 {
            color: #495057;
            margin-bottom: 12px;
            font-size: 1.15em;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .stats h3::before {
            content: "📊";
        }
        
        .stats-item {
            margin: 8px 0;
            font-size: 0.95em;
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
        }
        
        .stats-label {
            color: #666;
            font-weight: 500;
        }
        
        .stats-value {
            color: #333;
            font-weight: 600;
            min-width: 60px;
            text-align: right;
        }
        
        .stats-item.error {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #e0e0e0;
        }
        
        .stats-item.error .stats-label {
            color: #dc3545;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .stats-item.error .stats-label::before {
            content: "⚠️";
        }
        
        .character-item {
            display: inline-block;
            margin: 3px 2px;
            padding: 6px 12px;
            background: linear-gradient(135deg, #ffebee 0%, #ffcdd2 100%);
            border-radius: 18px;
            font-weight: bold;
            color: #c62828;
            font-size: 0.9em;
            box-shadow: 0 2px 4px rgba(198, 40, 40, 0.1);
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        
        .character-item::before {
            content: "×";
            font-size: 0.8em;
        }
        
        .reaction-time {
            background: linear-gradient(135deg, #fff3e0 0%, #ffecb3 100%);
            color: #e65100;
            font-weight: bold;
        }
        
        .stats-item.reaction-time .stats-label {
            color: #e65100;
            font-weight: bold;
        }
        
        .stats-item.reaction-time .stats-label::before {
            content: "⏱️";
        }
        
        .reaction-stats {
            margin-top: 20px;
            padding: 15px;
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
            border-radius: 16px;
            display: none;
        }
        
        .reaction-stats h4 {
            color: #1565c0;
            margin-bottom: 12px;
            text-align: center;
            font-size: 1.2em;
        }
        
        .reaction-detail {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(21, 101, 192, 0.2);
        }
        
        .reaction-detail:last-child {
            border-bottom: none;
        }
        
        .reaction-type {
            font-weight: bold;
            color: #1565c0;
        }
        
        .reaction-value {
            font-weight: bold;
            color: #d32f2f;
        }
        
        .restart-btn {
            background: linear-gradient(135deg, #43a047 0%, #66bb6a 100%);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 12px 30px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(67, 160, 71, 0.4);
            width: 100%;
        }
        
        .restart-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 8px rgba(67, 160, 71, 0.5);
        }
        
        /* 底部安全区域适配 */
        @supports (padding: max(0px)) {
            body {
                padding-bottom: max(20px, env(safe-area-inset-bottom));
            }
        }
        
        /* 暗黑模式支持 */
        @media (prefers-color-scheme: dark) {
            body {
                background: linear-gradient(135deg, #2d3748 0%, #4a5568 100%);
            }
            
            .container {
                background: #1a202c;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            }
            
            h1 {
                background: linear-gradient(45deg, #ff8787, #63b3ed);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
            }
            
            .subtitle, .stats-label {
                color: #a0aec0;
            }
            
            .character-display {
                color: #e2e8f0;
            }
            
            .option-btn {
                background: linear-gradient(135deg, #2d3748 0%, #4a5568 100%);
                border-color: #718096;
                color: #e2e8f0;
            }
            
            .stats {
                background: linear-gradient(135deg, #2d3748 0%, #4a5568 100%);
            }
            
            .stats-value {
                color: #f7fafc;
            }
            
            .character-item {
                background: linear-gradient(135deg, #2c0707 0%, #4a1c1c 100%);
                color: #ffcdd2;
            }
            
            .reaction-stats {
                background: linear-gradient(135deg, #1a237e 0%, #311b92 100%);
            }
            
            .reaction-detail {
                border-bottom-color: rgba(255, 255, 255, 0.2);
            }
            
            .reaction-type {
                color: #7986cb;
            }
            
            .reaction-value {
                color: #f48fb1;
            }
        }
        
        /* 触摸反馈效果 */
        @media (hover: none) and (pointer: coarse) {
            .option-btn, .next-btn, .end-btn, .restart-btn {
                padding: 20px 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>日语か行练习</h1>
            <p class="subtitle">か き く け こ | カ キ ク ケ コ</p>
        </div>
        
        <div class="character-display" id="characterDisplay"></div>
        
        <div class="result" id="result">选择下面的读音开始练习</div>
        
        <div class="options-container" id="optionsContainer">
            <!-- 选项按钮会通过JS动态生成 -->
        </div>
        
        <div class="control-buttons">
            <button class="next-btn" id="nextBtn">下一个</button>
            <button class="end-btn" id="endBtn">结束测试</button>
        </div>
        
        <div class="stats">
            <h3>练习统计</h3>
            <div class="stats-item">
                <span class="stats-label">总次数</span>
                <span class="stats-value" id="totalAttempts">0</span>
            </div>
            <div class="stats-item">
                <span class="stats-label">正确次数</span>
                <span class="stats-value" id="correctCount">0</span>
            </div>
            <div class="stats-item">
                <span class="stats-label">正确率</span>
                <span class="stats-value" id="accuracy">0%</span>
            </div>
            <div class="stats-item error">
                <span class="stats-label">错误记录</span>
                <span class="stats-value" id="errorLog">无</span>
            </div>
            <div class="stats-item reaction-time">
                <span class="stats-label">平均反应时间</span>
                <span class="stats-value" id="avgReactionTime">0.0s</span>
            </div>
        </div>
        
        <div class="reaction-stats" id="reactionStats">
            <h4>详细反应时间统计</h4>
            <div class="reaction-detail">
                <span class="reaction-type">平假名平均:</span>
                <span class="reaction-value" id="hiraganaAvg">0.0s</span>
            </div>
            <div class="reaction-detail">
                <span class="reaction-type">片假名平均:</span>
                <span class="reaction-value" id="katakanaAvg">0.0s</span>
            </div>
            <div class="reaction-detail">
                <span class="reaction-type">元音 'ka' 平均:</span>
                <span class="reaction-value" id="kaAvg">0.0s</span>
            </div>
            <div class="reaction-detail">
                <span class="reaction-type">元音 'ki' 平均:</span>
                <span class="reaction-value" id="kiAvg">0.0s</span>
            </div>
            <div class="reaction-detail">
                <span class="reaction-type">元音 'ku' 平均:</span>
                <span class="reaction-value" id="kuAvg">0.0s</span>
            </div>
            <div class="reaction-detail">
                <span class="reaction-type">元音 'ke' 平均:</span>
                <span class="reaction-value" id="keAvg">0.0s</span>
            </div>
            <div class="reaction-detail">
                <span class="reaction-type">元音 'ko' 平均:</span>
                <span class="reaction-value" id="koAvg">0.0s</span>
            </div>
            <button class="restart-btn" id="restartBtn">重新开始</button>
        </div>
    </div>

    <script>
        // か行日语假名数据 - 彻底重构数据结构
        const japaneseKaLine = [
            { id: 'hiragana_ka', character: 'か', kanaType: '平假名', romanji: 'ka', errorCount: 0 },
            { id: 'hiragana_ki', character: 'き', kanaType: '平假名', romanji: 'ki', errorCount: 0 },
            { id: 'hiragana_ku', character: 'く', kanaType: '平假名', romanji: 'ku', errorCount: 0 },
            { id: 'hiragana_ke', character: 'け', kanaType: '平假名', romanji: 'ke', errorCount: 0 },
            { id: 'hiragana_ko', character: 'こ', kanaType: '平假名', romanji: 'ko', errorCount: 0 },
            { id: 'katakana_ka', character: 'カ', kanaType: '片假名', romanji: 'ka', errorCount: 0 },
            { id: 'katakana_ki', character: 'キ', kanaType: '片假名', romanji: 'ki', errorCount: 0 },
            { id: 'katakana_ku', character: 'ク', kanaType: '片假名', romanji: 'ku', errorCount: 0 },
            { id: 'katakana_ke', character: 'ケ', kanaType: '片假名', romanji: 'ke', errorCount: 0 },
            { id: 'katakana_ko', character: 'コ', kanaType: '片假名', romanji: 'ko', errorCount: 0 }
        ];
        
        // 统计数据
        let stats = {
            totalAttempts: 0,
            correctCount: 0,
            currentCharacter: null,
            waitingForNext: false,
            startTime: 0,
            reactionTimes: [],
            hiraganaTimes: [],
            katakanaTimes: [],
            vowelTimes: {
                ka: [],
                ki: [],
                ku: [],
                ke: [],
                ko: []
            },
            testActive: true
        };
        
        // DOM元素
        const characterDisplay = document.getElementById('characterDisplay');
        const resultDisplay = document.getElementById('result');
        const optionsContainer = document.getElementById('optionsContainer');
        const nextBtn = document.getElementById('nextBtn');
        const endBtn = document.getElementById('endBtn');
        const restartBtn = document.getElementById('restartBtn');
        const totalAttemptsEl = document.getElementById('totalAttempts');
        const correctCountEl = document.getElementById('correctCount');
        const accuracyEl = document.getElementById('accuracy');
        const errorLogEl = document.getElementById('errorLog');
        const avgReactionTimeEl = document.getElementById('avgReactionTime');
        const hiraganaAvgEl = document.getElementById('hiraganaAvg');
        const katakanaAvgEl = document.getElementById('katakanaAvg');
        const kaAvgEl = document.getElementById('kaAvg');
        const kiAvgEl = document.getElementById('kiAvg');
        const kuAvgEl = document.getElementById('kuAvg');
        const keAvgEl = document.getElementById('keAvg');
        const koAvgEl = document.getElementById('koAvg');
        const reactionStats = document.getElementById('reactionStats');
        
        // 初始化选项按钮
        function initOptions() {
            const romanjiOptions = ['ka', 'ki', 'ku', 'ke', 'ko'];
            optionsContainer.innerHTML = '';
            
            romanjiOptions.forEach(romanji => {
                const button = document.createElement('button');
                button.className = 'option-btn';
                button.textContent = romanji;
                button.dataset.romanji = romanji;
                button.addEventListener('click', () => handleAnswer(romanji));
                button.disabled = false;
                optionsContainer.appendChild(button);
            });
        }
        
        // 获取加权随机字符 - 基于唯一ID
        function getWeightedRandomCharacter() {
            let totalWeight = 0;
            const weights = [];
            
            japaneseKaLine.forEach(vowel => {
                const weight = 1 + vowel.errorCount * 2;
                weights.push(weight);
                totalWeight += weight;
            });
            
            const random = Math.random() * totalWeight;
            let accumulated = 0;
            
            for (let i = 0; i < japaneseKaLine.length; i++) {
                accumulated += weights[i];
                if (random <= accumulated) {
                    return { ...japaneseKaLine[i] }; // 返回新对象，避免引用问题
                }
            }
            
            return { ...japaneseKaLine[0] };
        }
        
        // 显示下一个字符
        function showNextCharacter() {
            if (!stats.testActive) return;
            
            stats.currentCharacter = getWeightedRandomCharacter();
            characterDisplay.textContent = stats.currentCharacter.character;
            
            stats.startTime = Date.now();
            
            resultDisplay.textContent = '选择下面的读音';
            resultDisplay.className = 'result';
            resultDisplay.classList.remove('show');
            
            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.disabled = false;
                btn.className = 'option-btn';
            });
            
            nextBtn.disabled = true;
            stats.waitingForNext = false;
        }
        
        // 处理用户回答 - 彻底重构错误记录逻辑
        function handleAnswer(selectedRomanji) {
            if (stats.waitingForNext || !stats.testActive) return;
            if (!stats.currentCharacter || stats.startTime === 0) return;
            
            const reactionTime = (Date.now() - stats.startTime) / 1000;
            stats.reactionTimes.push(reactionTime);
            
            if (stats.currentCharacter.kanaType === '平假名') {
                stats.hiraganaTimes.push(reactionTime);
            } else {
                stats.katakanaTimes.push(reactionTime);
            }
            
            stats.vowelTimes[stats.currentCharacter.romanji].push(reactionTime);
            
            stats.totalAttempts++;
            const isCorrect = (selectedRomanji === stats.currentCharacter.romanji);
            
            // 关键修复：使用唯一ID直接更新数组中的字符
            const characterIndex = japaneseKaLine.findIndex(v => v.id === stats.currentCharacter.id);
            
            if (characterIndex === -1) {
                console.error('未找到对应字符:', stats.currentCharacter.id);
                return;
            }
            
            if (isCorrect) {
                stats.correctCount++;
                resultDisplay.textContent = `✓ 正确！${stats.currentCharacter.character} (${stats.currentCharacter.kanaType}) = ${selectedRomanji} (反应时间: ${reactionTime.toFixed(2)}s)`;
                resultDisplay.className = 'result correct';
                
                // 正确时减少错误计数，但不低于0
                if (japaneseKaLine[characterIndex].errorCount > 0) {
                    japaneseKaLine[characterIndex].errorCount = Math.max(0, japaneseKaLine[characterIndex].errorCount - 1);
                }
            } else {
                // 关键修复：错误时增加错误计数，直接操作数组
                japaneseKaLine[characterIndex].errorCount++;
                
                resultDisplay.textContent = `✗ 错误！${stats.currentCharacter.character} (${stats.currentCharacter.kanaType}) 读作 ${stats.currentCharacter.romanji} (反应时间: ${reactionTime.toFixed(2)}s)`;
                resultDisplay.className = 'result incorrect';
            }
            
            setTimeout(() => {
                resultDisplay.classList.add('show');
            }, 100);
            
            updateStatsDisplay();
            
            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.disabled = true;
                if (btn.dataset.romanji === selectedRomanji) {
                    btn.className = isCorrect ? 'option-btn correct' : 'option-btn incorrect';
                }
                if (btn.dataset.romanji === stats.currentCharacter.romanji && !isCorrect) {
                    btn.className = 'option-btn correct';
                }
            });
            
            nextBtn.disabled = false;
            stats.waitingForNext = true;
        }
        
        // 计算平均值
        function calculateAverage(times) {
            if (times.length === 0) return 0;
            return times.reduce((sum, time) => sum + time, 0) / times.length;
        }
        
        // 获取错误记录 - 彻底重构，确保所有错误都被记录
        function getErrorRecords() {
            // 关键修复：重新计算所有字符的错误，确保准确性
            const allErrors = [];
            
            // 按错误次数从高到低排序
            const sortedCharacters = [...japaneseKaLine].sort((a, b) => b.errorCount - a.errorCount);
            
            sortedCharacters.forEach(char => {
                if (char.errorCount > 0) {
                    allErrors.push({
                        id: char.id,
                        character: char.character,
                        kanaType: char.kanaType,
                        romanji: char.romanji,
                        errorCount: char.errorCount
                    });
                }
            });
            
            return allErrors;
        }
        
        // 更新统计显示 - 强制刷新错误记录
        function updateStatsDisplay() {
            totalAttemptsEl.textContent = stats.totalAttempts;
            correctCountEl.textContent = stats.correctCount;
            
            const accuracy = stats.totalAttempts > 0 
                ? Math.round((stats.correctCount / stats.totalAttempts) * 100) 
                : 0;
            accuracyEl.textContent = `${accuracy}%`;
            
            const avgReactionTime = calculateAverage(stats.reactionTimes);
            avgReactionTimeEl.textContent = stats.reactionTimes.length > 0 ? `${avgReactionTime.toFixed(2)}s` : '0.0s';
            
            // 关键修复：每次更新时重新获取错误记录，确保准确性
            const errorRecords = getErrorRecords();
            
            // 调试信息
            console.log('当前错误记录:', errorRecords.map(r => `${r.character}(${r.kanaType}): ${r.errorCount}`));
            
            if (errorRecords.length > 0) {
                let errorHTML = '';
                errorRecords.forEach(record => {
                    errorHTML += `<span class="character-item" title="${record.kanaType} ${record.character} (罗马字: ${record.romanji})">`
                        + `${record.character}<span style="font-size:0.7em;color:#c62828;margin-left:2px;">(${record.errorCount})</span></span>`;
                });
                errorLogEl.innerHTML = errorHTML;
            } else {
                errorLogEl.textContent = '无';
            }
        }
        
        // 显示结束测试结果
        function showTestResults() {
            stats.testActive = false;
            
            const avgReactionTime = calculateAverage(stats.reactionTimes);
            const hiraganaAvg = calculateAverage(stats.hiraganaTimes);
            const katakanaAvg = calculateAverage(stats.katakanaTimes);
            const kaAvg = calculateAverage(stats.vowelTimes.ka);
            const kiAvg = calculateAverage(stats.vowelTimes.ki);
            const kuAvg = calculateAverage(stats.vowelTimes.ku);
            const keAvg = calculateAverage(stats.vowelTimes.ke);
            const koAvg = calculateAverage(stats.vowelTimes.ko);
            
            hiraganaAvgEl.textContent = stats.hiraganaTimes.length > 0 ? `${hiraganaAvg.toFixed(2)}s` : '0.0s';
            katakanaAvgEl.textContent = stats.katakanaTimes.length > 0 ? `${katakanaAvg.toFixed(2)}s` : '0.0s';
            kaAvgEl.textContent = stats.vowelTimes.ka.length > 0 ? `${kaAvg.toFixed(2)}s` : '0.0s';
            kiAvgEl.textContent = stats.vowelTimes.ki.length > 0 ? `${kiAvg.toFixed(2)}s` : '0.0s';
            kuAvgEl.textContent = stats.vowelTimes.ku.length > 0 ? `${kuAvg.toFixed(2)}s` : '0.0s';
            keAvgEl.textContent = stats.vowelTimes.ke.length > 0 ? `${keAvg.toFixed(2)}s` : '0.0s';
            koAvgEl.textContent = stats.vowelTimes.ko.length > 0 ? `${koAvg.toFixed(2)}s` : '0.0s';
            
            // 强制更新错误记录
            updateStatsDisplay();
            
            reactionStats.style.display = 'block';
            
            nextBtn.disabled = true;
            endBtn.disabled = true;
            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.disabled = true;
            });
            
            setTimeout(() => {
                reactionStats.scrollIntoView({ behavior: 'smooth' });
            }, 300);
        }
        
        // 重新开始测试
        function restartTest() {
            stats = {
                totalAttempts: 0,
                correctCount: 0,
                currentCharacter: null,
                waitingForNext: false,
                startTime: 0,
                reactionTimes: [],
                hiraganaTimes: [],
                katakanaTimes: [],
                vowelTimes: {
                    ka: [],
                    ki: [],
                    ku: [],
                    ke: [],
                    ko: []
                },
                testActive: true
            };
            
            // 重置所有字符的错误计数
            japaneseKaLine.forEach(vowel => {
                vowel.errorCount = 0;
            });
            
            reactionStats.style.display = 'none';
            nextBtn.disabled = false;
            endBtn.disabled = false;
            
            updateStatsDisplay();
            showNextCharacter();
        }
        
        // 事件监听
        nextBtn.addEventListener('click', showNextCharacter);
        endBtn.addEventListener('click', showTestResults);
        restartBtn.addEventListener('click', restartTest);
        
        // 页面加载时初始化
        window.addEventListener('load', () => {
            initOptions();
            updateStatsDisplay();
            showNextCharacter();
        });
    </script>
</body>
</html>
